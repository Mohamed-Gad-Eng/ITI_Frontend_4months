<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <script src="jquery-3.7.1.js"></script>
    <style>
        body{
            margin: 0;
        }

        .myDiv{
            position: relative;
            width: calc(100% - 10px);
            height: 300px;
            padding: 30px 0px;
            border: 5px solid red;
            border-radius: 10px;
        }

        img{
            position: absolute;
            width: 130px;
            left: 0;
            /* left: calc(100% - 130px); */
        }

        p{
            position: absolute;
            top: 80px;
            left: 50px;
        }
    </style>
</head>
<body>
    <div class="myDiv">
        <img src="assets/12.gif" alt="myCar">
        <p>hello</p>
    </div>


    <script>
        var myImg = $("img");
        let leftVal = $(".myDiv").width() - myImg.width()

        myImg.animate({
            left: `${leftVal}px`
        },{
            duration: 5000,
            step: function(){
                $("p").text(myImg[0].outerHTML)
            }
        })
        
    </script>
</body>
</html>
