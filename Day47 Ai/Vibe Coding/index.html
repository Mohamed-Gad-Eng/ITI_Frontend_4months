<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QuickSort Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background: #020617;
        border-radius: 16px;
        padding: 24px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        max-width: 480px;
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 1.6rem;
        color: #f9fafb;
      }

      .subtitle {
        margin: 0 0 20px;
        font-size: 0.9rem;
        color: #9ca3af;
      }

      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: #e5e7eb;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #4b5563;
        background: #020617;
        color: #e5e7eb;
        outline: none;
        font-size: 0.95rem;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input[type="text"]::placeholder {
        color: #6b7280;
      }

      input[type="text"]:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.7);
      }

      button {
        margin-top: 14px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        color: #0b1120;
        font-weight: 600;
        letter-spacing: 0.03em;
        cursor: pointer;
        font-size: 0.95rem;
        transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
      }

      button:hover {
        filter: brightness(1.05);
        box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
        box-shadow: none;
      }

      .output {
        margin-top: 18px;
        padding: 12px 12px;
        border-radius: 10px;
        background: #020617;
        border: 1px solid #374151;
        font-size: 0.9rem;
        min-height: 40px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .output-title {
        font-weight: 600;
        margin-bottom: 4px;
        color: #e5e7eb;
      }

      .error {
        color: #fecaca;
      }

      .hint {
        margin-top: 8px;
        font-size: 0.8rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>QuickSort Visualizer</h1>
      <p class="subtitle">Enter numbers, and we'll sort them using your QuickSort implementation.</p>

      <form id="sortForm">
        <label for="numbers">Numbers (comma or space separated)</label>
        <input
          id="numbers"
          type="text"
          placeholder="e.g. 5, 3, 8, 4, 2, 7, 1, 10"
        />
        <button type="submit">Sort</button>
        <p class="hint">Example: <code>5, 3, 8, 4, 2, 7, 1, 10</code></p>
      </form>

      <div class="output" id="result">
        <div class="output-title">Result</div>
        <div id="resultContent">Sorted array will appear here.</div>
      </div>
    </div>

    <!-- Load your QuickSort implementation -->
    <script src="QuickSort_Inhanced.js"></script>
    <script>
      function parseInput(value) {
        const trimmed = value.trim();
        if (!trimmed) return [];

        const parts = trimmed.split(/[\s,]+/).filter(Boolean);
        const numbers = parts.map(Number);

        if (numbers.some((n) => Number.isNaN(n))) {
          throw new Error("Please enter only numbers separated by commas or spaces.");
        }

        return numbers;
      }

      const form = document.getElementById("sortForm");
      const input = document.getElementById("numbers");
      const resultBox = document.getElementById("resultContent");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        try {
          const arr = parseInput(input.value);
          const sorted = typeof quickSort === "function" ? quickSort(arr) : arr.slice().sort((a, b) => a - b);
          resultBox.classList.remove("error");
          resultBox.textContent = "Sorted: " + JSON.stringify(sorted);
        } catch (err) {
          resultBox.classList.add("error");
          resultBox.textContent = "Error: " + err.message;
        }
      });
    </script>
  </body>
</html>
