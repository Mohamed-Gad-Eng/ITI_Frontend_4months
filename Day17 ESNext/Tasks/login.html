<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | E-Commerce</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="header">
        <div class="logo">
            <div class="logo-img"><img src="images/20251005_144627.jpg" alt="Logo"></div>
            <p>E-Commerce</p>
        </div>
        <input type="checkbox" id="menu_checkbox" class="mobile-only">
        <label for="menu_checkbox" class="burger-label mobile-only">
            <div></div>
            <div></div>
            <div></div>
        </label>
        <!-- <div class="burger mobile-only" id="burger">☰</div> -->
        <div class="nav">
            <ul>
                <li class="mobile-only"><a href="cart.html">Cart <i class="fa-solid fa-cart-shopping"></i></a></li>
                <li><a href="#">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
        <div class="cart desktop-only">
            <a href="login.html">Login</a>
            <a href="cart.html">Cart <i class="fa-solid fa-cart-shopping fa-bounce"></i></a>
        </div>
    </div>
    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="login-btn">Login</button>

                <p class="register-link">
                    Don’t have an account? <a href="#">Register</a>
                </p>
            </form>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>

</html>
