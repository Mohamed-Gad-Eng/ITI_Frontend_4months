<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/sass/main.css">
  </head>

  <body>
    <!-- syntactically awesome style sheet -->
    <button class="button">click me</button>

    <hr>
    <br>

    <nav>
      <ul>
        <li>
          <a href="#">Link</a>
        </li>
      </ul>
    </nav>

    <hr>
    <br>

    <button class="primary-button">primary button</button>
    <button class="secondary-button">secondary button</button>
    <button class="submit-button">submit button</button>

    <hr>
    <br>

    <div class="element-shadow">shadow box</div>
    <br>
    <div class="card">card mixin</div>
    <br>
    <div class="card-two">card mixin</div>

    <hr>
    <br>

    <div class="header">header div</div>

    <hr>
    <br>

    <div class="color-1">This div has the first color</div>
    <div class="color-2">This div has the second color</div>
    <div class="color-3">This div has the third color</div>
    <div class="color-4">This div has the forth color</div>

    <hr>
    <br>

    <div class="mt-1">Small top margin (1rem)</div>
    <div class="mt-3">Medium top margin (3rem)</div>
    <div class="mt-5">Large top margin (5rem)</div>



    <div class="after">after text</div>
    <div class="before">before text</div>
    <div class="first-character">first-character text</div>


    <div class="transition"></div>
  </body>

</html>
