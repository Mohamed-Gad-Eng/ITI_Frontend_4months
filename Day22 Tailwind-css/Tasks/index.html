<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Tailwind</title>
</head>

<body class="bg-gray-200">
    <!-- container -->
    <div class="bg-white h-170 w-100 m-auto mt-5 px-5 py-10 rounded-xl">
        <!-- main info -->
        <div class="pb-5">
            <!-- circle -->
            <div class="h-20 w-20 m-auto bg-linear-to-r from-purple-500 to-pink-500 rounded-full">
            </div>
            <p class="text-center pt-2 font-bold">Alex Johnson</p>
            <p class="text-center pb-1 text-gray-500">@alexj</p>
            <p class="text-center text-gray-700">Digital designer & photography enthusiast.
                Love to travel and capture moments.</p>
        </div>
        <!-- numbers in table -->
        <div class="border-gray-300 border-t-1 border-b-1 p-3 mb-5">
            <table class="w-full text-center">
                <tr class="w-full">
                    <th>247</th>
                    <th>5.2K</th>
                    <th>892</th>
                </tr>
                <tr>
                    <td>Posts</td>
                    <td>Followers</td>
                    <td>Following</td>
                </tr>
            </table>
        </div class="flex">
        <!-- buttons -->

        <div class="flex justify-center gap-4 pb-5">
            <button class="bg-blue-500  py-2 px-14 text-l text-white font-semibold rounded-lg cursor-pointer 
                             hover:shadow-l">Follow</button>
            <button class="bg-gray-300  py-2 px-14 text-l text-black font-semibold rounded-lg cursor-pointer 
                             hover:shadow-l">Message</button>
        </div>
        <p class="pb-5">Recent Photos</p>
        <!-- colors -->
        <div class="flex flex-wrap justify-center gap-2">
            <div class="w-25 h-25 bg-blue-300 rounded-lg bg-linear-to-r from-purple-500 to-pink-500">
            </div>
            <div class="w-25 h-25 bg-blue-300 rounded-lg bg-linear-to-r from-purple-500 to-pink-500">
            </div>
            <div class="w-25 h-25 bg-blue-300 rounded-lg bg-linear-to-r from-purple-500 to-pink-500">
            </div>
            <div class="w-25 h-25 bg-blue-300 rounded-lg bg-linear-to-r from-purple-500 to-pink-500">
            </div>
            <div class="w-25 h-25 bg-blue-300 rounded-lg bg-linear-to-r from-purple-500 to-pink-500">
            </div>
            <div class="w-25 h-25 bg-blue-300 rounded-lg bg-linear-to-r from-purple-500 to-pink-500">
            </div>

        </div>
    </div>
</body>

</html>
